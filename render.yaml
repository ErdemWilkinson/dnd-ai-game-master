# Faz 7-C: Render Infrastructure-as-Code tanımı.
# Kullanım: Render dashboard'unda "New +" -> "Blueprint" -> bu repo'yu seçin,
# Render bu dosyayı okuyup aşağıdaki servisleri otomatik oluşturur.
# GEMINI_API_KEY (sync: false) Render dashboard'undan elle girilmeli - bu
# dosyada veya repoda hiçbir secret YOK.

databases:
  - name: dnd-game-db
    plan: free
    databaseName: dnd_game
    user: dnd_game

services:
  # Backend - Node.js Web Service
  - type: web
    name: dnd-game-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: dnd-game-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: AI_HOURLY_LIMIT
        value: "30"

  # Frontend - statik site (Vite build çıktısı)
  - type: web
    name: dnd-game-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE
        fromService:
          type: web
          name: dnd-game-backend
          property: hostport
        # Render "hostport" degeri sadece host:port dondurur; asagidaki gibi
        # tam URL + /api yolu icin deploy sonrasi bu degeri elle
        # "https://dnd-game-backend.onrender.com/api" ile guncellemek gerekebilir
        # (Render Blueprint'lerde servisler-arasi tam URL referansi surum
        # bagimli olabilir - dashboard'da dogrulayin).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    # Yaratıcı cron fikir #24: backend'e helmet (#23) eklendi ama statik
    # frontend site hiç güvenlik header'ı kullanmıyordu. Google Fonts
    # (index.html'de fonts.googleapis.com/fonts.gstatic.com) ve React'in
    # inline style prop'ları (CharacterCard/TacticalGrid'deki HP/mana barları,
    # grid-template-columns) CSP'yi kırmasın diye style-src'te 'unsafe-inline'
    # + fonts.googleapis.com, font-src'te fonts.gstatic.com açıkça izinli.
    # connect-src'e prod backend origin'i eklendi (VITE_API_BASE bu URL'e
    # gidiyor) - eksik olsaydı CSP tüm API çağrılarını sessizce engellerdi.
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src 'self' https://fonts.gstatic.com;
          img-src 'self' data:;
          script-src 'self';
          connect-src 'self' https://dnd-game-backend-sz9e.onrender.com;
          frame-ancestors 'none'
