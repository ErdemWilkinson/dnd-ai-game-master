# Faz 7-C: Render Infrastructure-as-Code tanımı.
# Kullanım: Render dashboard'unda "New +" -> "Blueprint" -> bu repo'yu seçin,
# Render bu dosyayı okuyup aşağıdaki servisleri otomatik oluşturur.
# GEMINI_API_KEY (sync: false) Render dashboard'undan elle girilmeli - bu
# dosyada veya repoda hiçbir secret YOK.

databases:
  - name: dnd-game-db
    plan: free
    databaseName: dnd_game
    user: dnd_game

services:
  # Backend - Node.js Web Service
  - type: web
    name: dnd-game-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: dnd-game-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash
      - key: AI_HOURLY_LIMIT
        value: "30"

  # Frontend - statik site (Vite build çıktısı)
  - type: web
    name: dnd-game-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # ONEMLI: "fromService: hostport" KULLANMA - Render'in hostport ozelligi
      # sadece "host:port" (semasiz, yanlis port) donduruyor, tarayicidan
      # erisilebilir bir https URL degil. Bu deger Blueprint sync'inde her
      # deploy'da dashboard'daki manuel duzeltmeyi EZIYORDU (2026-08-24'te
      # PM tarafindan canli olarak tespit edildi - karakter olusturma
      # prod'da sessizce calismiyordu). Backend'in gercek public URL'i
      # sabit deger olarak yazildi, boylece her deploy'da ayni kaliyor.
      - key: VITE_API_BASE
        value: https://dnd-game-backend-sz9e.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
