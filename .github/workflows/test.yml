name: Test

# Yaratıcı cron fikir #59: hiç CI pipeline'ı yoktu, kırık bir commit ancak
# manuel `npm test` çalıştırılırsa fark ediliyordu. Deploy'u bloke etmiyor
# (Render, bu workflow'dan bağımsız kendi build/deploy'unu yapıyor) - sadece
# erken uyarı/görünürlük için. Secret gerekmiyor: backend testleri zaten
# VITEST=true altında SQLite'a (:memory:) düşüyor ve AI/rate-limit mock'a
# düşüyor (bkz. backend/data/db.js, services/publicRateLimit.js).
on:
  push:
  pull_request:
    branches: [main, master]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Yaratıcı cron fikir #72: `data/db.js`, VITEST=true altında DATABASE_URL
    # olsa bile HER ZAMAN SQLite'a düşüyor (bkz. db.js) - yani `npm test`
    # (vitest) `dbPostgres.js`'i hiç import etmiyordu, prod'un kullandığı en
    # kritik kod yolu hiç CI'da koşmuyordu. Bir Postgres service container'ı
    # ekleyip `scripts/pgSmokeTest.js`'i düz `node` ile (VITEST set OLMADAN)
    # çalıştırarak gerçek Postgres CRUD'ını da doğruluyoruz.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dnd_game_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: node scripts/pgSmokeTest.js
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/dnd_game_test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
